name: CI

# Deterministic pre-merge gate (Roadmap/WAYS-OF-WORKING.md → Review & merge):
#   lint             — eslint on the files THIS branch changed (incremental by design)
#   typecheck-build  — tsc --noEmit + next build, on the PR branch code
#   prep             — resolve the PR's Vercel preview once
#   e2e              — four sharded Playwright API gates against that preview
#   e2e-browser      — non-blocking browser smokes against that preview
#
# Why poll the Vercel API instead of the `deployment_status` event: a workflow
# triggered by `deployment_status` runs the file from the DEFAULT branch, so it
# could never self-verify on this PR before merge. Triggering on `pull_request`
# runs the branch's own workflow file; we then resolve the preview URL for the
# head commit ourselves and hit it through the protection-bypass token.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Closes a real gap: WAYS-OF-WORKING has said "type-check + lint + build clean" for months while
  # nothing here ran lint. It is INCREMENTAL on purpose — a clean checkout has 124 pre-existing
  # errors, 52 of them React Hooks correctness rules on live commerce surfaces, so a full-tree gate
  # could only be made green by downgrading the rules, which looks enforcing while enforcing nothing.
  # Same incremental shape as doc-format.mjs's swept-paths allow-list. See scripts/lint-changed.mjs.
  lint:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lint-changed diffs against the merge-base with origin/main; a shallow clone has no
          # merge-base and the script fails loudly rather than passing vacuously.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint changed files
        run: npm run lint:changed
      # The PDF renderer's allow-list, secret and queue (share-kit D14). Its guard needs only node:crypto, so this
      # runs without the service's own install — and it is the only gate that service has.
      - name: PDF renderer guard (node --test)
        run: node --test services/print-pdf/guard.test.js

  typecheck-build:
    name: Type-check + build
    runs-on: ubuntu-latest
    # Browser-public (publishable) build vars only — these already ship in the
    # production bundle. No server secrets: every commerce route is dynamic, so
    # `next build` needs nothing privileged (verified locally).
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${{ vars.NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL }}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${{ vars.NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL }}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_MEDUSA_STORE_URL: ${{ vars.NEXT_PUBLIC_MEDUSA_STORE_URL }}
      NEXT_PUBLIC_MEDUSA_MXN_REGION_ID: ${{ vars.NEXT_PUBLIC_MEDUSA_MXN_REGION_ID }}
      NEXT_PUBLIC_MP_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_MP_PUBLIC_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      MEDUSA_STORE_URL: ${{ vars.MEDUSA_STORE_URL }}
      # Skip Sentry sourcemap upload in CI (no auth token) — build only.
      SENTRY_SKIP_AUTO_RELEASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Verify built client artifacts
        # These guards inspect .next itself, so this is their authoritative CI
        # home. The preview shards below intentionally have no local build.
        run: npx playwright test e2e/sentry-replay-build.spec.ts e2e/buyer-route-vendor-manifest.spec.ts e2e/perf-budget.spec.ts e2e/collapsible-description-native.spec.ts e2e/excerpt-panel-native.spec.ts e2e/cuenta-menu-native.spec.ts e2e/ai-agent-button-native.spec.ts --project=api --grep 'S3\.[1-4]'

  prep:
    name: Resolve Vercel preview
    runs-on: ubuntu-latest
    outputs:
      playwright_base_url: ${{ steps.preview.outputs.playwright_base_url }}
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PRINT_STUDIO_TOKEN: ${{ secrets.PRINT_STUDIO_TOKEN }}
    steps:
      - name: Resolve Vercel preview URL for this commit
        id: preview
        run: |
          set -euo pipefail
          echo "Waiting for the Vercel preview of commit ${HEAD_SHA:0:8}…"
          for i in $(seq 1 40); do
            resp=$(curl -s -H "Authorization: Bearer $VERCEL_API_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&target=preview&limit=20")
            state=$(echo "$resp" | jq -r --arg s "$HEAD_SHA" \
              'first(.deployments[] | select(.meta.githubCommitSha==$s)) | (.state // .readyState) // ""')
            url=$(echo "$resp" | jq -r --arg s "$HEAD_SHA" \
              'first(.deployments[] | select(.meta.githubCommitSha==$s)) | .url // ""')
            echo "  attempt $i: state=${state:-<none>} url=${url:-<none>}"
            case "$state" in
              READY)
                echo "playwright_base_url=https://$url" >> "$GITHUB_OUTPUT"
                echo "Preview ready: https://$url"
                exit 0 ;;
              ERROR|CANCELED)
                echo "::error::Preview deployment $state for $HEAD_SHA"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the Vercel preview of $HEAD_SHA"; exit 1

  e2e:
    name: Playwright API vs preview (shard ${{ matrix.shard }}/4)
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — a failing shard must NOT cancel its siblings. The default (true) would
      # report the first failure and kill the rest, so a run with breakage in three shards looks
      # identical to one with breakage in one. On a test gate you want the whole picture in one run;
      # the workflow still fails either way (requirement: any shard red ⇒ gate red).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.prep.outputs.playwright_base_url }}
      # Artifact guards run against the local .next in typecheck-build. This
      # job checks the deployed preview and deliberately has no local build.
      REMOTE_PREVIEW_ONLY: "true"
      # The bypass token (wired into playwright.config.ts) reaches the SSO-gated preview.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run Playwright API shard against the preview
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

  e2e-browser:
    name: Browser smokes vs preview (non-blocking)
    needs: prep
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.prep.outputs.playwright_base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # ANONYMOUS browser smokes against the preview — NON-BLOCKING (continue-on-error)
      # so the gate stays the api suite above.
      #
      # ── This step used to exist TWICE, and used to claim credentials it never had ──
      #
      # Until 2026-08-19 this job ran `npm run test:e2e:browser` twice: once with the
      # env block below, then again immediately with no env at all, each followed by its
      # own summary step. The second summary OVERWROTE the first's artifact, so the
      # uploaded fixture-skip report described the run that had none of the fixtures.
      # Two chromium installs and two full browser suites per PR, and the report that
      # survived was the wrong one.
      #
      # The env block also set `MS_TEST_BROWSER_AUTH: "1"` and mapped
      # `secrets.MS_TEST_CLERK_PUBLISHABLE_KEY` / `secrets.MS_TEST_CLERK_SECRET_KEY`.
      # NEITHER SECRET EXISTS — the repo's are named `CLERK_PUBLISHABLE_KEY` and
      # `CLERK_SECRET_KEY` — and GitHub resolves a missing secret to an empty string,
      # so `authEnabled()` (e2e/_helpers/auth.ts) has been false on every run this job
      # has ever made. 29 authed tests across 15 spec files skipped while the workflow
      # looked like it was running them.
      #
      # Renaming the secrets would NOT fix it, which is why they are gone rather than
      # corrected. Clerk's testing token is dev-instance only and a dev instance allows
      # localhost origins only, so clerk-js never readies on an SSO-gated ephemeral
      # preview (Roadmap/LEARNINGS.md → "authed browser smokes"). The comment that used
      # to sit here said exactly that while the env below contradicted it.
      #
      # The authed layer therefore runs LOCALLY, against `npm run dev`, as category B of
      # `node scripts/smoke-sweep.mjs`. That is where it is real; here it was decoration.
      - name: Browser smokes vs preview (non-blocking)
        continue-on-error: true
        # Fixtures are scoped to THIS STEP, not the job.
        #
        # At job level they also reached the api gate and un-skipped two fixture-gated API specs
        # (ucp-cutover-api, unclaimed-guardrails) that then FAILED — turning the deterministic gate
        # red. That failure is a fixture-DATA problem, not a code one: the configured listing has no
        # instant payment method, so `payment_options` comes back empty. Those specs have been
        # silently skipping for as long as the fixtures were unset, and they fail the moment the
        # fixtures are supplied — a real provisioning gap, tracked separately.
        env:
          MS_TEST_UNCLAIMED_LISTING_ID: ${{ secrets.MS_TEST_UNCLAIMED_LISTING_ID }}
          MS_TEST_CLAIMED_SLUG: ${{ secrets.MS_TEST_CLAIMED_SLUG }}
          MS_TEST_PDP_LISTING_ID: ${{ secrets.MS_TEST_PDP_LISTING_ID }}
          MS_TEST_GALLERY_LISTING_ID: ${{ secrets.MS_TEST_GALLERY_LISTING_ID }}
          MS_TEST_GALLERY_SINGLE_LISTING_ID: ${{ secrets.MS_TEST_GALLERY_SINGLE_LISTING_ID }}
          MS_TEST_GALLERY_ZERO_LISTING_ID: ${{ secrets.MS_TEST_GALLERY_ZERO_LISTING_ID }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:browser

      - name: Summarize credentialed browser-smoke skips
        if: always()
        run: node scripts/browser-smoke-summary.mjs

      - name: Upload browser-smoke fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-fixture-skips
          path: test-results/browser-smoke-fixture-skips.json
          if-no-files-found: warn
          retention-days: 7

      # `if: always()`, and this job HAS to be the one that says so out loud.
      #
      # This job is `continue-on-error: true`, so it reports success no matter what
      # happens inside it — which means an `if: failure()` upload (the shape the
      # nightly workflow uses, correctly, because the nightly can fail) would NEVER
      # fire here. The result: every browser failure on a preview for as long as this
      # job has existed produced a red ✘ in a log and no trace, no screenshot, no
      # report. Nine specs failed on 2026-08-19 and the only artifact on the run was
      # a 2.3 KB fixture-skip summary.
      #
      # That is why nobody diagnosed them. A layer that can fail but cannot be
      # investigated is not a layer, and the fix is one condition and one path.
      - name: Upload the Playwright browser report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
