name: arm64 image (Oracle VM)

# miyagi-to-oracle-vm S1.2 — the production image for the Oracle A1 VM (`panfleto-prod`, aarch64).
#
# Built HERE, on a native arm64 runner, because the VM has 2 shared cores and also runs panfleto: a
# `next build` there would starve every tenant on the box, and a rollback would be another slow build.
# The VM only ever PULLS `ghcr.io/danybgoode/miyagisanchez-storefront:<sha>` — a rollback is a restart.
# (The image was `miyagi-web` until the 2026-10-28 rename.)
#
# Build args mirror cloudbuild.yaml EXACTLY (guarded by e2e/image-arm64-build-args.spec.ts):
#   - the eight browser-public keys come from the `production` GitHub Environment as `PROD_<NAME>`. The
#     PREFIX is load-bearing: an environment variable that is missing silently falls back to a REPO-level
#     variable of the same name, and the repo-level `NEXT_PUBLIC_*` hold CI values (localhost store URL,
#     pk_test keys) — so with plain names a missing production value would bake a test key into prod and
#     the emptiness check below could never fire (PR #432 review). No repo-level PROD_* exists.
#   - the routing literals are cloudbuild.yaml's own substitution defaults, copied below.
# A missing production variable FAILS the build: a manual image build without NEXT_PUBLIC values
# cannot boot (Clerk fail-fast at startup — LEARNINGS, gcp-account-migration (7)).
#
# Since the 2026-10-16 cutover this is the ONLY production build (the Cloud Build trigger is deleted).
# It deploys nothing: the VM pulls `:main` when `/opt/miyagi/infra/oci/update.sh` runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-arm64
  cancel-in-progress: false

jobs:
  build:
    name: Build + push linux/arm64
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to build without every production value
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PROD_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ vars.PROD_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_MEDUSA_MXN_REGION_ID: ${{ vars.PROD_NEXT_PUBLIC_MEDUSA_MXN_REGION_ID }}
          NEXT_PUBLIC_MP_PUBLIC_KEY: ${{ vars.PROD_NEXT_PUBLIC_MP_PUBLIC_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.PROD_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.PROD_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          missing=0
          for v in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY \
                   NEXT_PUBLIC_MEDUSA_MXN_REGION_ID NEXT_PUBLIC_MP_PUBLIC_KEY \
                   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY NEXT_PUBLIC_SUPABASE_URL \
                   NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_VAPID_PUBLIC_KEY; do
            if [ -z "${!v}" ]; then echo "::error::production environment variable $v is not set"; missing=1; fi
          done
          # Test-mode keys in a production image: Clerk signs everyone into the dev instance, Stripe and
          # Mercado Pago take no real payment. Each production key has a recognisable live prefix.
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in pk_live_*) ;; *) echo "::error::Clerk key is not pk_live_"; missing=1;; esac
          case "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" in pk_live_*) ;; *) echo "::error::Stripe key is not pk_live_"; missing=1;; esac
          case "$NEXT_PUBLIC_MP_PUBLIC_KEY" in APP_USR-*) ;; *) echo "::error::Mercado Pago key is not APP_USR-"; missing=1;; esac
          case "$NEXT_PUBLIC_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "::error::Supabase URL is not https://*.supabase.co"; missing=1;; esac
          exit $missing

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # The moving `:main` tag is what the VM's update.sh resolves, so ONLY a build of refs/heads/main may
          # move it — a manual dispatch from a feature branch gets its sha tag and nothing else.
          tags: |
            ghcr.io/danybgoode/miyagisanchez-storefront:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/danybgoode/miyagisanchez-storefront:main' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=miyagisanchez-storefront-arm64
          cache-to: type=gha,scope=miyagisanchez-storefront-arm64,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.PROD_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.PROD_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MEDUSA_MXN_REGION_ID=${{ vars.PROD_NEXT_PUBLIC_MEDUSA_MXN_REGION_ID }}
            NEXT_PUBLIC_MP_PUBLIC_KEY=${{ vars.PROD_NEXT_PUBLIC_MP_PUBLIC_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.PROD_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.PROD_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.PROD_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_MEDUSA_STORE_URL=https://api.miyagisanchez.com
            NEXT_PUBLIC_SITE_URL=https://miyagisanchez.com
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/
            NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/
            NEXT_PUBLIC_GTM_ID=GTM-MWHVLJ3M
            NEXT_PUBLIC_MIYAGI_WHATSAPP=

      # The image's own sharp gate (`node -e "require('sharp')"` in the Dockerfile) proves the native
      # library loads on arm64 at BUILD time. The VM smoke (S1.5) proves a real /api/img request.
